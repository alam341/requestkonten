<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMO Dashboard — Maknarona by Adsy</title>
  <link rel="icon" type="image/png" href="../assets/logo-maknarona.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0eef8;
      min-height: 100vh;
      color: #1e1e2e;
    }

    /* Sticky Header */
    .app-header {
      position: sticky; top: 0; z-index: 50;
      background: #fff;
      padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 12px rgba(80,70,160,0.08);
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-logo { height: 32px; width: auto; }
    .header-title { font-size: 15px; font-weight: 800; color: #4f46e5; line-height: 1; }
    .header-sub { font-size: 11px; color: #9ca3af; line-height: 1.3; }
    .header-smo-name { font-size: 13px; font-weight: 700; color: #1e1e2e; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .logout-btn {
      padding: 8px 14px; border-radius: 10px;
      background: #f5f4fb; border: none; color: #6b7280;
      font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s;
      min-height: 36px;
    }
    .logout-btn:hover { background: #fef2f2; color: #dc2626; }

    /* Main content */
    .main { max-width: 600px; margin: 0 auto; padding: 16px 12px 32px; }

    /* Tab pills horizontal scroll */
    .tabs-wrap {
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      padding-bottom: 4px; margin-bottom: 16px;
      scrollbar-width: none;
    }
    .tabs-wrap::-webkit-scrollbar { display: none; }
    .tabs-inner { display: flex; gap: 8px; width: max-content; padding: 2px 0; }
    .tab-pill {
      padding: 9px 18px; border-radius: 99px;
      border: 1.5px solid #e5e3f5;
      background: #fff; color: #6b7280;
      font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
      min-height: 40px; display: inline-flex; align-items: center;
    }
    .tab-pill:hover { border-color: #4f46e5; color: #4f46e5; }
    .tab-pill.active { background: #4f46e5; color: #fff; border-color: #4f46e5; }

    /* Content card */
    .content-wrap { display: flex; flex-direction: column; gap: 14px; }

    .konten-card {
      background: #fff; border-radius: 14px;
      box-shadow: 0 2px 10px rgba(80,70,160,0.07);
      overflow: hidden; transition: box-shadow 0.2s;
    }
    .konten-card.uploaded { opacity: 0.6; }
    .konten-card:active { box-shadow: 0 4px 16px rgba(80,70,160,0.12); }

    .konten-thumb {
      width: 100%; aspect-ratio: 16/9;
      background: #f0eef8; object-fit: cover;
      display: block;
    }
    .konten-thumb-fallback {
      width: 100%; aspect-ratio: 16/9;
      background: linear-gradient(135deg, #ede9fe, #f0eef8);
      display: flex; align-items: center; justify-content: center;
      font-size: 48px;
    }

    .konten-body { padding: 14px 16px; }
    .konten-creator { font-size: 14px; font-weight: 700; color: #1e1e2e; }
    .konten-meta { font-size: 12px; color: #9ca3af; margin-top: 3px; }
    .konten-actions { display: flex; gap: 10px; margin-top: 14px; }

    .btn-download {
      flex: 1; padding: 12px;
      background: #4f46e5; color: #fff;
      border: none; border-radius: 10px;
      font-size: 14px; font-weight: 700;
      cursor: pointer; transition: background 0.2s;
      min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-download:hover { background: #4338ca; }
    .btn-download:active { background: #3730a3; }

    .btn-upload {
      flex: 1; padding: 12px;
      background: #d1fae5; color: #065f46;
      border: 1.5px solid #a7f3d0; border-radius: 10px;
      font-size: 14px; font-weight: 700;
      cursor: pointer; transition: all 0.2s;
      min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-upload:hover { background: #a7f3d0; }
    .btn-upload:active { background: #6ee7b7; }

    .status-badge {
      display: inline-flex; align-items: center;
      font-size: 11px; font-weight: 700;
      padding: 4px 12px; border-radius: 99px;
    }
    .status-badge.pending { background: #f3f4f6; color: #6b7280; }
    .status-badge.downloaded { background: #dbeafe; color: #1d4ed8; }
    .status-badge.uploaded { background: #d1fae5; color: #065f46; }

    /* Separator for uploaded section */
    .section-sep {
      font-size: 11px; font-weight: 700; color: #9ca3af;
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 8px 0 4px; border-top: 1.5px dashed #e5e3f5;
      margin-top: 8px;
    }

    /* Empty state */
    .empty-state {
      text-align: center; padding: 48px 20px;
      color: #c4c0f0;
    }
    .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; font-weight: 600; }
    .empty-state small { font-size: 12px; color: #d1d5db; margin-top: 4px; display: block; }

    /* Loading */
    .loading-state {
      text-align: center; padding: 40px 20px; color: #9ca3af;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .main { padding: 12px 8px 24px; }
    }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <div class="app-header">
    <div class="header-left">
      <img src="../assets/logo-maknarona.png" alt="Maknarona" class="header-logo">
      <div>
        <div class="header-title">SMO</div>
        <div class="header-sub">Maknarona by Adsy</div>
      </div>
    </div>
    <div class="header-right">
      <div class="header-smo-name" id="smoName">—</div>
      <button class="logout-btn" onclick="doLogout()">Keluar</button>
    </div>
  </div>

  <!-- Main -->
  <div class="main">

    <!-- Dropdown 3 level: Produk → Toko → Akun -->
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">
      <select id="produkSelect" onchange="onProdukChange(this.value)" style="width:100%;padding:13px 14px;border:1.5px solid #e5e3f5;border-radius:14px;background:#fff;color:#1e1e2e;font-size:14px;font-weight:600;outline:none;cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2216%22 height=%2216%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%236b7280%22 stroke-width=%222%22><polyline points=%226 9 12 15 18 9%22/></svg>');background-repeat:no-repeat;background-position:right 14px center;box-shadow:0 2px 8px rgba(80,70,160,0.06)">
        <option value="">-- Pilih Produk --</option>
      </select>
      <select id="tokoSelect" onchange="onTokoChange(this.value)" style="width:100%;padding:13px 14px;border:1.5px solid #e5e3f5;border-radius:14px;background:#fff;color:#1e1e2e;font-size:14px;font-weight:600;outline:none;cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2216%22 height=%2216%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%236b7280%22 stroke-width=%222%22><polyline points=%226 9 12 15 18 9%22/></svg>');background-repeat:no-repeat;background-position:right 14px center;box-shadow:0 2px 8px rgba(80,70,160,0.06);display:none">
        <option value="">-- Pilih Toko --</option>
      </select>
      <select id="akunSelect" onchange="selectAkun(this.value)" style="width:100%;padding:13px 14px;border:1.5px solid #e5e3f5;border-radius:14px;background:#fff;color:#1e1e2e;font-size:14px;font-weight:600;outline:none;cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2216%22 height=%2216%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%236b7280%22 stroke-width=%222%22><polyline points=%226 9 12 15 18 9%22/></svg>');background-repeat:no-repeat;background-position:right 14px center;box-shadow:0 2px 8px rgba(80,70,160,0.06);display:none">
        <option value="">-- Pilih Akun --</option>
      </select>
    </div>

    <!-- Konten list -->
    <div class="content-wrap" id="kontenList">
      <div class="loading-state">Memuat konten...</div>
    </div>

  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://woqznjubhmjraqapgyat.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndvcXpuanViaG1qcmFxYXBneWF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5MzUxNTgsImV4cCI6MjA5MjUxMTE1OH0.xBHG0aeKLutXyqTjlhpGVIYy7-wuI-ztI9e73wmRL04';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ── AUTH CHECK ───────────────────────────────────────────
    const raw = localStorage.getItem('smo_session');
    if (!raw) { window.location.href = 'login.html'; }

    let smoSession = null;
    try { smoSession = JSON.parse(raw); } catch(e) { window.location.href = 'login.html'; }
    if (!smoSession) { window.location.href = 'login.html'; }

    document.getElementById('smoName').textContent = smoSession.name;

    // ── STATE ────────────────────────────────────────────────
    let allAkun = [];
    let selectedAkunId = null;

    // ── INIT ─────────────────────────────────────────────────
    async function init() {
      await loadAkun();
    }

    async function loadAkun() {
      const { data } = await supabase
        .from('tiktok_accounts')
        .select('*')
        .order('produk')
        .order('tipe');

      allAkun = data || [];

      const produkSelect = document.getElementById('produkSelect');

      if (!allAkun.length) {
        produkSelect.innerHTML = '<option value="">Belum ada akun TikTok</option>';
        document.getElementById('kontenList').innerHTML = '<div class="empty-state"><div class="emoji">📱</div><p>Belum ada akun TikTok</p><small>Minta admin untuk menambah akun.</small></div>';
        return;
      }

      // Render dropdown produk (unik)
      const produkList = [...new Set(allAkun.map(a => a.produk))].sort();
      produkSelect.innerHTML = '<option value="">-- Pilih Produk --</option>' +
        produkList.map(p => `<option value="${p}">${p}</option>`).join('');
    }

    window.onProdukChange = function(produk) {
      const tokoSelect = document.getElementById('tokoSelect');
      const akunSelect = document.getElementById('akunSelect');
      const kontenList = document.getElementById('kontenList');

      // Reset downstream
      akunSelect.style.display = 'none';
      akunSelect.innerHTML = '<option value="">-- Pilih Akun --</option>';
      kontenList.innerHTML = '';
      selectedAkunId = null;

      if (!produk) {
        tokoSelect.style.display = 'none';
        tokoSelect.innerHTML = '<option value="">-- Pilih Toko --</option>';
        return;
      }

      // Tampilkan toko (akun utama) sesuai produk
      const tokoList = allAkun.filter(a => a.produk === produk && a.tipe === 'utama');
      if (!tokoList.length) {
        tokoSelect.innerHTML = '<option value="">Belum ada toko untuk produk ini</option>';
        tokoSelect.style.display = 'block';
        return;
      }

      tokoSelect.innerHTML = '<option value="">-- Pilih Toko --</option>' +
        tokoList.map(t => `<option value="${t.id}">${t.toko || t.username} (@${t.username})</option>`).join('');
      tokoSelect.style.display = 'block';
      tokoSelect.value = '';
    };

    window.onTokoChange = function(tokoId) {
      const akunSelect = document.getElementById('akunSelect');
      const kontenList = document.getElementById('kontenList');

      kontenList.innerHTML = '';
      selectedAkunId = null;

      if (!tokoId) {
        akunSelect.style.display = 'none';
        akunSelect.innerHTML = '<option value="">-- Pilih Akun --</option>';
        return;
      }

      const toko = allAkun.find(a => a.id === tokoId);
      const pemasaranList = allAkun.filter(a => a.utama_id === tokoId);

      let options = '<option value="">-- Pilih Akun --</option>';
      options += `<optgroup label="Akun Utama"><option value="${toko.id}">${toko.toko || toko.username} (@${toko.username})</option></optgroup>`;
      if (pemasaranList.length) {
        options += '<optgroup label="Akun Pemasaran">' +
          pemasaranList.map(p => `<option value="${p.id}">@${p.username}${p.keterangan ? ' · ' + p.keterangan : ''}</option>`).join('') +
          '</optgroup>';
      }

      akunSelect.innerHTML = options;
      akunSelect.style.display = 'block';
      akunSelect.value = '';
    };

    window.selectAkun = function(akunId) {
      if (!akunId) { document.getElementById('kontenList').innerHTML = ''; return; }
      selectedAkunId = akunId;
      loadKonten(akunId);
    };

    async function loadKonten(akunId) {
      const list = document.getElementById('kontenList');
      list.innerHTML = '<div class="loading-state">Memuat konten...</div>';

      const { data } = await supabase
        .from('tiktok_contents')
        .select('*')
        .eq('akun_id', akunId)
        .order('created_at', { ascending: false });

      if (!data || !data.length) {
        list.innerHTML = '<div class="empty-state"><div class="emoji">📭</div><p>Belum ada konten</p><small>Tunggu CC submit konten ke akun ini.</small></div>';
        return;
      }

      // Sort: pending & downloaded dulu, uploaded di bawah
      const active = data.filter(c => c.status !== 'uploaded');
      const uploaded = data.filter(c => c.status === 'uploaded');

      let html = active.map(c => renderKontenCard(c)).join('');

      if (uploaded.length) {
        html += `<div class="section-sep">Sudah Diupload (${uploaded.length})</div>`;
        html += uploaded.map(c => renderKontenCard(c)).join('');
      }

      list.innerHTML = html || '<div class="empty-state"><div class="emoji">📭</div><p>Belum ada konten</p></div>';
    }

    function extractFileId(url) {
      if (!url) return null;
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (match) return match[1];
      const match2 = url.match(/id=([a-zA-Z0-9_-]+)/);
      return match2 ? match2[1] : null;
    }

    function renderKontenCard(c) {
      const fileId = extractFileId(c.link_drive);
      const thumbSrc = fileId ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w400` : null;

      const tgl = new Date(c.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
      const creatorLabel = c.creator_name || 'Creator';

      // Status badge
      const badgeMap = {
        pending: `<span class="status-badge pending">Belum Download</span>`,
        downloaded: `<span class="status-badge downloaded">Sudah Download</span>`,
        uploaded: `<span class="status-badge uploaded">Sudah Upload</span>`,
      };
      const badge = badgeMap[c.status] || badgeMap.pending;

      // Actions
      let actionsHtml = '';
      if (c.status === 'pending') {
        actionsHtml = `<button class="btn-download" onclick="doDownload('${c.id}', '${c.link_drive}')">⬇ Download</button>`;
      } else if (c.status === 'downloaded') {
        actionsHtml = `
          <button class="btn-download" onclick="doDownload('${c.id}', '${c.link_drive}')" style="background:#6b7280">⬇ Download Ulang</button>
          <button class="btn-upload" onclick="showBoostInput('${c.id}')">✅ Sudah Diupload</button>
          <div id="boostForm-${c.id}" style="display:none;margin-top:10px;display:none">
            <input id="boostInput-${c.id}" type="text" placeholder="Kode Boost (wajib diisi)" style="width:100%;padding:10px 12px;border:1.5px solid #e5e3f5;border-radius:10px;font-size:13px;outline:none;margin-bottom:8px;box-sizing:border-box">
            <div style="display:flex;gap:8px">
              <button onclick="markUploaded('${c.id}')" style="flex:1;padding:10px;background:#10b981;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;min-height:44px">Konfirmasi Upload</button>
              <button onclick="hideBoostInput('${c.id}')" style="padding:10px 14px;border:1.5px solid #e5e3f5;background:#fff;color:#6b7280;border-radius:10px;font-size:13px;cursor:pointer;min-height:44px">Batal</button>
            </div>
          </div>
        `;
      } else {
        // uploaded — tampilkan kode boost kalau ada
        actionsHtml = c.kode_boost ? `<div style="margin-top:6px;padding:8px 12px;background:#f0fdf4;border-radius:8px;border:1px solid #bbf7d0;font-size:12px;color:#16a34a;font-weight:600">🚀 Kode Boost: ${c.kode_boost}</div>` : '';
      }

      // Thumb image or fallback
      const thumbHtml = thumbSrc
        ? `<img class="konten-thumb" src="${thumbSrc}" alt="thumb" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
          + `<div class="konten-thumb-fallback" style="display:none">🎬</div>`
        : `<div class="konten-thumb-fallback">🎬</div>`;

      return `
        <div class="konten-card${c.status === 'uploaded' ? ' uploaded' : ''}" id="card-${c.id}">
          ${thumbHtml}
          <div class="konten-body">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
              <div>
                <div class="konten-creator">${creatorLabel}</div>
                <div class="konten-meta">${tgl}</div>
              </div>
              ${badge}
            </div>
            ${actionsHtml ? `<div class="konten-actions">${actionsHtml}</div>` : ''}
          </div>
        </div>
      `;
    }

    window.doDownload = async function(contentId, linkDrive) {
      // Buka link di tab baru
      window.open(linkDrive, '_blank');

      // Update status ke downloaded
      const now = new Date().toISOString();
      const { error } = await supabase
        .from('tiktok_contents')
        .update({ status: 'downloaded', downloaded_at: now })
        .eq('id', contentId);

      if (!error) {
        // Reload konten untuk update UI
        await loadKonten(selectedAkunId);
      }
    };

    window.showBoostInput = function(contentId) {
      document.getElementById(`boostForm-${contentId}`).style.display = 'block';
    };

    window.hideBoostInput = function(contentId) {
      document.getElementById(`boostForm-${contentId}`).style.display = 'none';
    };

    window.markUploaded = async function(contentId) {
      const inputEl = document.getElementById(`boostInput-${contentId}`);
      const kode_boost = inputEl ? inputEl.value.trim() : '';

      if (!kode_boost) {
        inputEl.style.borderColor = '#ef4444';
        inputEl.placeholder = 'Kode Boost wajib diisi!';
        inputEl.focus();
        return;
      }

      inputEl.style.borderColor = '#e5e3f5';
      const now = new Date().toISOString();

      const { error } = await supabase
        .from('tiktok_contents')
        .update({ status: 'uploaded', uploaded_at: now, kode_boost })
        .eq('id', contentId);

      if (!error) await loadKonten(selectedAkunId);
    };

    window.doLogout = function() {
      localStorage.removeItem('smo_session');
      window.location.href = 'login.html';
    };

    init();
  </script>
</body>
</html>
