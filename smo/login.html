<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login SMO — Maknarona by Adsy</title>
  <link rel="icon" type="image/png" href="../assets/logo-maknarona.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #eae8f5;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 36px 40px 32px;
      width: 100%; max-width: 400px;
      box-shadow: 0 8px 40px rgba(80,70,160,0.10);
    }
    .brand {
      display: flex; flex-direction: column; align-items: center; margin-bottom: 28px;
    }
    .brand-title { font-size: 16px; font-weight: 800; color: #4f46e5; line-height: 1; margin-top: 8px; }
    .brand-sub { font-size: 11px; font-weight: 500; color: #9ca3af; margin-top: 4px; letter-spacing: 0.05em; }
    .role-badge {
      display: inline-block; margin-top: 10px;
      background: #4f46e5; color: #fff;
      font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 4px 14px; border-radius: 99px;
    }
    .field { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 11px; font-weight: 700;
      color: #6b7280; letter-spacing: 0.08em;
      text-transform: uppercase; margin-bottom: 7px;
    }
    input {
      width: 100%; padding: 13px 16px;
      border: none; border-radius: 12px;
      font-size: 14px; color: #1e1e2e;
      background: #f5f4fb; outline: none;
      transition: box-shadow 0.2s, background 0.2s;
    }
    input:focus {
      background: #eeecfb;
      box-shadow: 0 0 0 2px #c7c2f5;
    }
    input::placeholder { color: #b0adc8; }
    .btn {
      width: 100%; padding: 14px;
      background: #4f46e5; color: #fff;
      border: none; border-radius: 14px;
      font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 6px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { background: #4338ca; }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { background: #c4c0f0; cursor: not-allowed; }
    .error-msg {
      color: #dc2626; font-size: 13px; margin-top: 12px;
      text-align: center; display: none;
    }
    .footer-text {
      text-align: center; font-size: 12px;
      color: #b0adc8; margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="../assets/logo-maknarona.png" alt="Maknarona by Adsy" style="height:64px;width:auto;">
      <div class="brand-title">Maknarona</div>
      <div class="brand-sub">by Adsy · Platform Content Creator</div>
      <div class="role-badge">SMO Login</div>
    </div>

    <div class="field">
      <label>Username</label>
      <input type="text" id="inputUsername" placeholder="Username SMO kamu" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="inputPassword" placeholder="Password" />
    </div>
    <button class="btn" id="loginBtn" onclick="doLogin()">Masuk</button>
    <p class="error-msg" id="errorMsg">Username atau password salah.</p>
    <p class="footer-text">Portal khusus tim Social Media Officer.</p>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://woqznjubhmjraqapgyat.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndvcXpuanViaG1qcmFxYXBneWF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5MzUxNTgsImV4cCI6MjA5MjUxMTE1OH0.xBHG0aeKLutXyqTjlhpGVIYy7-wuI-ztI9e73wmRL04';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Kalau sudah login, redirect langsung
    const existing = localStorage.getItem('smo_session');
    if (existing) window.location.href = 'dashboard.html';

    window.doLogin = async function() {
      const username = document.getElementById('inputUsername').value.trim();
      const password = document.getElementById('inputPassword').value;
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('errorMsg');

      if (!username || !password) { err.style.display = 'block'; err.textContent = 'Isi username dan password.'; return; }

      btn.disabled = true; btn.textContent = 'Memeriksa...';
      err.style.display = 'none';

      const { data, error } = await supabase
        .from('smos')
        .select('id, name, username')
        .eq('username', username)
        .eq('password', password)
        .single();

      btn.disabled = false; btn.textContent = 'Masuk';

      if (error || !data) {
        err.textContent = 'Username atau password salah.';
        err.style.display = 'block';
        return;
      }

      localStorage.setItem('smo_session', JSON.stringify({ id: data.id, name: data.name, username: data.username }));
      window.location.href = 'dashboard.html';
    };

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') window.doLogin();
    });
  </script>
</body>
</html>
